name: kuradi_saased
description: A low resolution CGA karate brawler built with Flutter and Flame.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flame: 1.23.0
  # Same tested versions as the newer CoolorBurn audio player.
  flame_audio: 2.10.3
  audioplayers: 6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  flutter_gen_runner: 5.12.0
  # Shader reference builder: FlutterGen 5.12 reads assets, not shaders.
  build: ^2.4.2
  yaml: ^3.1.3
flutter:
  uses-material-design: true
  assets:
    # Scenery, fighters, menu/lore, reference sprite-button art and settings icons.
    - resources/images/
    - resources/sound/
    - resources/fonts/
  shaders:
    - resources/shaders/crt.frag
  fonts:
    - family: Arcade
      fonts:
        - asset: resources/fonts/PressStart2P-Regular.ttf
